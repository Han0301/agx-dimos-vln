# Configuration used by ../start.sh.
#
# Insta360 CameraSDK is proprietary and must be obtained from:
# https://www.insta360.com/sdk/home
#
# Set one source. The archive source may be an official ZIP/TAR file or an
# already extracted SDK directory.
CAMERA_SDK_URL="${CAMERA_SDK_URL:-}"
CAMERA_SDK_ARCHIVE="${CAMERA_SDK_ARCHIVE:-}"
CAMERA_SDK_DIR="${CAMERA_SDK_DIR:-}"
CAMERA_SDK_SHA256="${CAMERA_SDK_SHA256:-}"

# Downloads are cached here. The upload package does not contain this directory.
SDK_CACHE_DIR="${SDK_CACHE_DIR:-${WORKSPACE_DIR}/downloads}"

# Set to 1 to run apt/sudo setup non-interactively.
AUTO_INSTALL_SYSTEM_DEPS="${AUTO_INSTALL_SYSTEM_DEPS:-0}"
AUTO_SETUP_UDEV="${AUTO_SETUP_UDEV:-0}"

# Validate that ROS, Python modules and native libraries stay inside the
# workspace before launching the camera stack.
RUN_STANDALONE_CHECK="${RUN_STANDALONE_CHECK:-1}"
