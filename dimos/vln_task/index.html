<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLN Navigation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; font-size: 1.5rem; }
  .cameras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .cam-panel { background: #16213e; border-radius: 12px; padding: 16px; }
  .cam-panel h2 { font-size: 0.95rem; color: #00d4ff; margin-bottom: 10px; }
  .cam-panel .placeholder {
    width: 100%; min-height: 200px; border-radius: 8px; background: #0f3460;
    display: flex; align-items: center; justify-content: center; color: #666; font-size: 0.85rem;
  }
  .cam-panel img.feed {
    width: 100%; border-radius: 8px; background: #000; min-height: 200px; object-fit: contain;
    display: block;
  }
  .bottom { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 900px) { .bottom { grid-template-columns: 1fr 1fr; } }
  .panel { background: #16213e; border-radius: 12px; padding: 20px; }
  .panel h2 { font-size: 1rem; color: #00d4ff; margin-bottom: 12px; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: 10px 14px; border: 1px solid #333; border-radius: 8px;
    background: #0f3460; color: #fff; font-size: 1rem; outline: none;
  }
  input[type=text]:focus { border-color: #00d4ff; }
  input[type=file] { color: #aaa; font-size: 0.85rem; margin-top: 4px; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 1rem;
    cursor: pointer; font-weight: 600; transition: background 0.2s;
  }
  .btn-go { background: #00d4ff; color: #1a1a2e; margin-right: 8px; }
  .btn-go:hover { background: #00b8d9; }
  .btn-stop { background: #e94560; color: #fff; }
  .btn-stop:hover { background: #c73e54; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 10px; background: #0f3460; border-radius: 8px; font-size: 0.9rem; }
  #status .label { color: #aaa; }
  #ref-preview { max-width: 200px; max-height: 150px; border-radius: 6px; margin-top: 8px; display: none; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  #log { margin-top: 12px; max-height: 200px; overflow-y: auto; font-size: 0.8rem; color: #888; }
  #log div { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
  @media (max-width: 1100px) { .cameras { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .cameras { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>VLN Navigation Interface</h1>
  <div class="cameras">
    <div class="cam-panel">
      <h2>Go2 camera</h2>
      <img class="feed" id="cam-go2" src="/camera_feed" alt="Go2 camera"
           onerror="this.style.display='none'; document.getElementById('ph-go2').style.display='flex';">
      <div class="placeholder" id="ph-go2" style="display:none">Waiting for feed…</div>
    </div>
    <div class="cam-panel">
      <h2>RealSense RGB</h2>
      <img class="feed" id="cam-rs" src="/realsense_feed" alt="RealSense RGB"
           onerror="this.style.display='none'; document.getElementById('ph-rs').style.display='flex';">
      <div class="placeholder" id="ph-rs" style="display:none">Waiting for feed…</div>
    </div>
    <div class="cam-panel">
      <h2>RealSense depth</h2>
      <img class="feed" id="cam-depth" src="/depth_feed" alt="RealSense depth"
           onerror="this.style.display='none'; document.getElementById('ph-depth').style.display='flex';">
      <div class="placeholder" id="ph-depth" style="display:none">Waiting for feed…</div>
    </div>
    <div class="cam-panel">
      <h2>Frontier overlay</h2>
      <img class="feed" id="cam-frontier" src="/frontier_feed" alt="Frontier overlay"
           onerror="this.style.display='none'; document.getElementById('ph-frontier').style.display='flex';">
      <div class="placeholder" id="ph-frontier" style="display:none">Waiting for feed…</div>
    </div>
  </div>
  <div class="bottom">
    <div class="panel">
      <h2>Navigation target</h2>
      <form id="nav-form" enctype="multipart/form-data">
        <div class="input-group">
          <label for="goal">Text goal</label>
          <input type="text" id="goal" name="goal"
                 placeholder="e.g. find the glasses box in CTO office room" autofocus>
        </div>
        <div class="input-group">
          <label for="image">Reference image (optional)</label>
          <input type="file" id="image" name="image" accept="image/*">
          <img id="ref-preview" alt="preview">
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-go" id="btn-go">Navigate</button>
          <button type="button" class="btn btn-stop" id="btn-stop">Stop</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>Status</h2>
      <div id="status" role="status"><span class="label">Status:</span> <span id="status-text">idle</span></div>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
const form = document.getElementById('nav-form');
const goalEl = document.getElementById('goal');
const imageEl = document.getElementById('image');
const preview = document.getElementById('ref-preview');
const statusText = document.getElementById('status-text');
const logEl = document.getElementById('log');
const goButton = document.getElementById('btn-go');
const stopButton = document.getElementById('btn-stop');
let taskId = null;
let statusVersion = 0;
let actionPending = false;
let lastSearchState = null;

function log(msg) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  logEl.prepend(d);
  if (logEl.children.length > 50) logEl.lastChild.remove();
}

function showStatus(message, stage = '', statusTaskId = null) {
  statusText.textContent = message;
  statusText.dataset.stage = stage;
  const searchState = stage ? statusTaskId + ':' + stage : null;
  if (searchState && searchState !== lastSearchState) log(message);
  lastSearchState = searchState;
}

function setActionPending(pending) {
  actionPending = pending;
  goButton.disabled = pending;
  stopButton.disabled = pending;
  if (pending) statusVersion += 1;
}

imageEl.addEventListener('change', () => {
  const file = imageEl.files[0];
  if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
  else { preview.style.display = 'none'; }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (actionPending) return;
  setActionPending(true);
  const fd = new FormData();
  fd.append('goal', goalEl.value);
  if (imageEl.files[0]) fd.append('image', imageEl.files[0]);
  try {
    const r = await fetch('/navigate', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.success) {
      taskId = j.task_id;
      showStatus('navigating: ' + j.goal);
      log('Sent: ' + j.goal);
    } else {
      log('Error: ' + j.message);
    }
  } catch (err) {
    log('Network error: ' + err);
  } finally {
    setActionPending(false);
  }
});

stopButton.addEventListener('click', async () => {
  if (actionPending) return;
  setActionPending(true);
  try {
    const response = await fetch('/stop', { method: 'POST' });
    if (!response.ok) throw new Error('Stop failed');
    showStatus('stopped');
    log('Navigation stopped');
  } catch (err) {
    log('Network error: ' + err);
  } finally {
    setActionPending(false);
  }
});

async function pollStatus() {
  const version = statusVersion;
  try {
    if (actionPending) return;
    const url = taskId ? '/status?task_id=' + encodeURIComponent(taskId) : '/status';
    const response = await fetch(url);
    const data = await response.json();
    if (version !== statusVersion) return;
    if (response.ok) {
      showStatus(data.status, data.stage, data.task_id);
    } else if (response.status === 404) {
      showStatus('任务记录已过期');
    }
  } catch (err) {
    // Keep the last known state while the service is temporarily unreachable.
  } finally {
    setTimeout(pollStatus, 350);
  }
}

pollStatus();
</script>
</body>
</html>
