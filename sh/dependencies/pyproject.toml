[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-mininum"
version = "0.1.0"
description = "DimOS Mininum for Go2 ROS communication and visual-language navigation"
license = "Apache-2.0"
license-files = ["licenses/LICENSE", "licenses/NOTICE.md"]
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "numpy>=1.26"]

[project.optional-dependencies]
go2 = ["unitree-webrtc-connect==2.1.2", "aiortc==1.14.0", "aioice==0.10.2", "wasmtime==41.0.0"]
path_tracker = ["scipy==1.17.0"]
agent = ["httpx==0.28.1", "Pillow==12.3.0", "fastapi==0.162.4", "python-multipart==0.0.32", "uvicorn==0.54.0", "opencv-python==4.13.0.92", "websocket-client==1.9.0"]
test = ["pytest>=8"]

[project.scripts]
dimos = "dimos.core.cli:main"

[tool.setuptools]
package-dir = {"dimos" = "../../dimos"}
packages = [
    "dimos",
    "dimos.core",
    "dimos.vln_task",
    "dimos.vln_task.search",
    "dimos.plugins",
    "dimos.plugins.xnavdp",
    "dimos.plugins.vlm",
    "dimos.plugins.active_search",
    "dimos.plugins.spatial_memory",
    "dimos.plugins.llm",
    "dimos.plugins.web_input",
    "dimos.plugins.path_tracker",
    "dimos.plugins.runtime_log",
    "dimos.plugins.xnavdp.visualization",
    "dimos.robot",
    "dimos.robot.unitree",
    "dimos.robot.unitree.go2",
]

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/test_ros_io.py" = ["E402"]

[tool.setuptools.package-data]
"dimos.vln_task" = ["index.html"]

[tool.setuptools.cmdclass]
sdist = "_build.sdist"
